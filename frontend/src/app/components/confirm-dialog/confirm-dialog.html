<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" [mat-dialog-close]="false">Cancel</button>

  <button matButton="filled" [mat-dialog-close]="true">Confirm</button>
</mat-dialog-actions>
